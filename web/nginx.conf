# otium-web: the SPA shell, plus proxy locations for the Go server.
#
# In the homelab those proxy locations never run. Caddy splits /api/* and /auth/*
# off to otium-server before the request reaches this container, so it can hold
# them across an otium-server deploy - otium-server is a single-replica Recreate
# pod, and nginx open source has no retry to give a one-server proxy_pass upstream
# (proxy_next_upstream moves to a different peer; there is no different peer). See
# nottingham-cloud#521 and k3s/infra/auth/caddy-config.yaml in that repo.
#
# They are kept anyway, on purpose: otium-web + otium-server is meant to work as a
# standalone pair for anyone running the two images without an edge proxy in front.
# Just know that editing them changes nothing about otium.fisher.sh.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API + health go to the Go server. Bypassed in k3s - see the note above.
    location /api/ {
        proxy_pass http://otium-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /healthz {
        proxy_pass http://otium-server:8080;
    }

    # OIDC flow is served by the Go server, not the SPA. Also bypassed in k3s.
    location /auth/ {
        proxy_pass http://otium-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # PWA service worker: must revalidate on every load so updates ship promptly
    # (the browser byte-compares sw.js), and must be served with a JS type.
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # PWA manifest needs the right MIME or browsers reject it.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # SPA fallback. The app shell (index.html) and the version stamp must revalidate
    # on every load so a new deploy actually reaches an installed PWA - otherwise the
    # browser heuristically caches index.html (it had no Cache-Control) and the PWA
    # stays pinned to an old build with no way to hard-refresh. Hashed /assets/ stay
    # immutable, so this only re-fetches the tiny shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA icons are stable; let them cache.
    location /icons/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
