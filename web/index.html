    <!-- #142: apply the saved theme before first paint so there's no light->dark
         flash. Falls back to the OS preference, then light. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.presentation = localStorage.getItem("otium-presentation") === "eink" ? "eink" : "standard";
          var t = localStorage.getItem("otium-theme");
          if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#141413" : "#f5f1e8");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
